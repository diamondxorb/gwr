services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: gwr_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gwr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gwr_pass}
      POSTGRES_DB: ${POSTGRES_DB:-gwr_imoveis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gwr_user} -d ${POSTGRES_DB:-gwr_imoveis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gwr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgis
    profiles:
      - tools

volumes:
  pgdata:
